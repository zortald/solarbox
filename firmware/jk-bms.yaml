# Плата ESP32-C3 для JK BMS по Bluetooth.
# Первая прошивка — базовая: Wi-Fi, точка доступа для настройки, OTA,
# веб-страница и поиск BMS. Чтение самой BMS (syssi/esphome-jk-bms)
# добавляется следующей прошивкой по воздуху, когда известны MAC и протокол.
#
#   esphome run jk-bms.yaml --device /dev/cu.usbmodem31201   # первый раз
#   esphome run jk-bms.yaml --device jk-bms.local            # дальше OTA

esphome:
  name: jk-bms
  friendly_name: JK BMS

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome
  - platform: web_server

wifi:
  # Без приоритетов: ESPHome берёт самую сильную точку.
  networks:
    - ssid: !secret site_wifi_ssid
      password: !secret site_wifi_password
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  # Нет известной сети — плата поднимает свою точку, Wi-Fi выбирается с телефона.
  ap:
    ssid: "battery"
    password: "88888888"

captive_portal:

web_server:
  port: 80

external_components:
  - source: github://syssi/esphome-jk-bms@main
    components: [jk_bms_ble]
    refresh: 0s

esp32_ble_tracker:

ble_client:
  - mac_address: 00:00:00:00:00:00
    id: bms_client

jk_bms_ble:
  - ble_client_id: bms_client
    id: bms0
    protocol_version: JK02_32S
    throttle: 2s

sensor:
  - platform: wifi_signal
    id: w_rssi
    name: "Сигнал Wi-Fi"
  - platform: uptime
    id: up
    internal: true
    update_interval: 60s
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      id: b_v
      name: "Напряжение АКБ V"
    current:
      id: b_a
      name: "Ток АКБ I"
    power:
      id: b_w
      name: "Мощность АКБ W"
    state_of_charge:
      id: b_soc
      name: "Заряд АКБ SOC"
    capacity_remaining:
      id: b_cap
      name: "Остаток АКБ Ah"
    full_charge_capacity:
      id: b_fcc
      name: "Ёмкость полного заряда Ah"
    charging_cycles:
      id: b_cycles
      name: "Циклы заряда"
    temperature_sensor_1:
      id: b_t1
      name: "Темп АКБ T1"
    temperature_sensor_2:
      id: b_t2
      name: "Темп АКБ T2"
    power_tube_temperature:
      id: b_tmos
      name: "Темп MOS Tm"
    min_cell_voltage:
      id: b_cmin
      name: "Ячейка мин Vmin"
    max_cell_voltage:
      id: b_cmax
      name: "Ячейка макс Vmax"
    delta_cell_voltage:
      id: b_cd
      name: "Разброс ячеек Vd"
    cell_voltage_1:
      id: b_c1
      internal: true
    cell_voltage_2:
      id: b_c2
      internal: true
    cell_voltage_3:
      id: b_c3
      internal: true
    cell_voltage_4:
      id: b_c4
      internal: true
    cell_voltage_5:
      id: b_c5
      internal: true
    cell_voltage_6:
      id: b_c6
      internal: true
    cell_voltage_7:
      id: b_c7
      internal: true
    cell_voltage_8:
      id: b_c8
      internal: true
    cell_resistance_1:
      id: b_r1
      internal: true
    cell_resistance_2:
      id: b_r2
      internal: true
    cell_resistance_3:
      id: b_r3
      internal: true
    cell_resistance_4:
      id: b_r4
      internal: true
    cell_resistance_5:
      id: b_r5
      internal: true
    cell_resistance_6:
      id: b_r6
      internal: true
    cell_resistance_7:
      id: b_r7
      internal: true
    cell_resistance_8:
      id: b_r8
      internal: true
    min_voltage_cell:
      id: b_cmin_i
      internal: true
    max_voltage_cell:
      id: b_cmax_i
      internal: true
    average_cell_voltage:
      id: b_cavg
      internal: true
    balancing_current:
      id: b_bal_a
      internal: true

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging:
      id: b_chg
      name: "Заряжается CHG"
    discharging:
      id: b_dsg
      name: "Разряжается DSG"
    balancing:
      id: b_bal
      name: "Баланс BAL"

text_sensor:
  - platform: version
    name: "Версия FW"
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    errors:
      name: "Ошибки ERR"
    total_runtime_formatted:
      name: "Наработка RT"

button:
  - platform: restart
    name: "Перезагрузка RST"
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    retrieve_settings:
      name: "Прочитать настройки BMS"

# Калибровка SOC. BMS считает заряд по ампер-часам от заданной ёмкости и
# сама выставляет 100 % / 0 %, когда ячейка доходит до порогов SOC100 / SOC0.
# «Установить заряд» записывает текущий процент напрямую (только JK02_32S).
number:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_battery_capacity:
      name: "Ёмкость АКБ Ah"
    cell_soc100_voltage:
      name: "Порог SOC 100% V"
    cell_soc0_voltage:
      name: "Порог SOC 0% V"
    soc_calibration:
      name: "Установить заряд SOC"

# Push to solarbox (standalone dashboard on the main router container).
http_request:
  verify_ssl: false
  timeout: 3s

interval:
  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.post:
                url: http://192.168.88.1:8080/api/ingest
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["device"] = "bms";
                  JsonObject m = root["metrics"].to<JsonObject>();
                  auto put = [&](const char *k, float v) { if (!std::isnan(v)) m[k] = v; };
                  auto flag = [&](const char *k, binary_sensor::BinarySensor *b) { if (b->has_state()) m[k] = b->state ? 1 : 0; };
                  put("soc", id(b_soc).state);
                  put("bms_v", id(b_v).state);
                  put("bms_a", id(b_a).state);
                  put("bms_w", id(b_w).state);
                  put("cap_ah", id(b_cap).state);
                  put("fcc_ah", id(b_fcc).state);
                  put("cycles", id(b_cycles).state);
                  put("t1", id(b_t1).state);
                  put("t2", id(b_t2).state);
                  put("t_mos", id(b_tmos).state);
                  put("cell_min", id(b_cmin).state);
                  put("cell_max", id(b_cmax).state);
                  put("cell_delta", id(b_cd).state);
                  flag("chg", id(b_chg));
                  flag("dsg", id(b_dsg));
                  flag("bal", id(b_bal));
                  put("rssi", id(w_rssi).state);
                  put("uptime", id(up).state);
                  put("cell_avg", id(b_cavg).state);
                  put("bal_a", id(b_bal_a).state);
                  put("cell_min_i", id(b_cmin_i).state);
                  put("cell_max_i", id(b_cmax_i).state);
                  static const char *const CK[] = {"c1", "c2", "c3", "c4", "c5", "c6", "c7", "c8"};
                  static const char *const RK[] = {"r1", "r2", "r3", "r4", "r5", "r6", "r7", "r8"};
                  sensor::Sensor *const cv[] = {id(b_c1), id(b_c2), id(b_c3), id(b_c4), id(b_c5), id(b_c6), id(b_c7), id(b_c8)};
                  sensor::Sensor *const cr[] = {id(b_r1), id(b_r2), id(b_r3), id(b_r4), id(b_r5), id(b_r6), id(b_r7), id(b_r8)};
                  for (int i = 0; i < 8; i++) { put(CK[i], cv[i]->state); put(RK[i], cr[i]->state); }
