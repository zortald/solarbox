# Solarbox · плата JK BMS по Bluetooth (ESP32-C3). Универсальная прошивка:
# ничего про объект внутри. Wi-Fi задаётся после прошивки (web.esphome.io →
# Improv, или точка доступа платы → страница настройки), адрес Solarbox и MAC
# BMS — в мастере Solarbox или на веб-странице платы. Всё хранится во флеше и
# переживает обновления по воздуху.
#
# Пустой «Solarbox URL» = http://<шлюз сети>:8080 — Solarbox на роутере.

substitutions:
  fw_version: "1.0.0"

esphome:
  name: solarbox-bms
  friendly_name: Solarbox BMS
  name_add_mac_suffix: true
  project:
    name: solarbox.jk-ble
    version: ${fw_version}
  on_boot:
    - priority: -100
      then:
        - lambda: id(apply_bms_mac).execute();

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
  - platform: web_server

# Сетей нет в прошивке — поэтому сохранённый Wi-Fi не теряется при обновлениях.
wifi:
  ap:
    ssid: "Solarbox-BMS"
    password: "solarbox"
  power_save_mode: none

captive_portal:
improv_serial:

web_server:
  port: 80

external_components:
  - source: github://syssi/esphome-jk-bms@main
    components: [jk_bms_ble]
    refresh: 1d

# Поиск BMS рядом: имена JK-* попадают в список, Solarbox показывает его в мастере.
globals:
  - id: found
    type: std::map<std::string, std::string>

esp32_ble_tracker:
  scan_parameters:
    active: true
  on_ble_advertise:
    - then:
        - lambda: |-
            const std::string &n = x.get_name();
            if (n.rfind("JK", 0) == 0 || n.rfind("jk", 0) == 0) {
              if (id(found).size() < 12 || id(found).count(x.address_str()))
                id(found)[x.address_str()] = n + "|" + std::to_string(x.get_rssi());
            }

ble_client:
  - mac_address: "00:00:00:00:00:00"
    id: bms_client
    auto_connect: false

jk_bms_ble:
  - ble_client_id: bms_client
    id: bms0
    protocol_version: JK02_32S
    throttle: 2s

script:
  - id: apply_bms_mac
    then:
      - lambda: |-
          std::string s = id(bms_mac).state;
          uint64_t a = 0; int n = 0;
          for (char c : s) {
            int v = (c >= '0' && c <= '9') ? c - '0' : (c >= 'a' && c <= 'f') ? c - 'a' + 10 : (c >= 'A' && c <= 'F') ? c - 'A' + 10 : -1;
            if (v < 0) continue;
            a = (a << 4) | v; n++;
          }
          if (n != 12) { ESP_LOGW("solarbox", "BMS MAC не задан"); id(bms_client).set_auto_connect(false); return; }
          id(bms_client).disconnect();
          id(bms_client).set_address(a);
          id(bms_client).set_auto_connect(true);
          ESP_LOGI("solarbox", "BMS MAC %s", s.c_str());

text:
  - platform: template
    id: sb_url
    name: "Solarbox URL"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 96
    initial_value: ""
  - platform: template
    id: bms_mac
    name: "BMS MAC"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 17
    initial_value: ""
    on_value:
      - script.execute: apply_bms_mac
  - platform: template
    id: dev_name
    name: "Имя в Solarbox"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 24
    initial_value: "bms"

