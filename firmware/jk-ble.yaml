# Отправка в Solarbox: метрики + кто я (тип, версия, MAC, IP) + найденные BMS.
http_request:
  verify_ssl: false
  timeout: 3s

interval:
  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.post:
                url: !lambda |-
                  std::string u = id(sb_url).state;
                  if (u.empty()) {
                    esp_netif_ip_info_t ip;
                    esp_netif_get_ip_info(esp_netif_get_handle_from_ifkey("WIFI_STA_DEF"), &ip);
                    char gw[16];
                    esp_ip4addr_ntoa(&ip.gw, gw, sizeof gw);
                    u = std::string("http://") + gw + ":8080";
                  }
                  while (!u.empty() && u.back() == '/') u.pop_back();
                  return u + "/api/ingest";
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["device"] = id(dev_name).state.empty() ? "bms" : id(dev_name).state;
                  JsonObject b = root["board"].to<JsonObject>();
                  b["type"] = "jk-ble";
                  b["fw"] = "${fw_version}";
                  b["mac"] = get_mac_address_pretty();
                  {
                    esp_netif_ip_info_t ii;
                    esp_netif_get_ip_info(esp_netif_get_handle_from_ifkey("WIFI_STA_DEF"), &ii);
                    char ipb[16];
                    esp_ip4addr_ntoa(&ii.ip, ipb, sizeof ipb);
                    b["ip"] = ipb;
                  }
                  b["bms_mac"] = id(bms_mac).state;
                  b["connected"] = id(bms_client).connected();
                  JsonArray f = b["found"].to<JsonArray>();
                  for (auto &kv : id(found)) {
                    JsonObject o = f.add<JsonObject>();
                    o["mac"] = kv.first;
                    auto p = kv.second.rfind('|');
                    o["name"] = kv.second.substr(0, p);
                    o["rssi"] = atoi(kv.second.c_str() + p + 1);
                  }
                  JsonObject m = root["metrics"].to<JsonObject>();
                  auto put = [&](const char *k, float v) { if (!std::isnan(v)) m[k] = v; };
                  auto flag = [&](const char *k, binary_sensor::BinarySensor *s) { if (s->has_state()) m[k] = s->state ? 1 : 0; };
                  put("soc", id(b_soc).state);
                  put("bms_v", id(b_v).state);
                  put("bms_a", id(b_a).state);
                  put("bms_w", id(b_w).state);
                  put("cap_ah", id(b_cap).state);
                  put("fcc_ah", id(b_fcc).state);
                  put("cycles", id(b_cycles).state);
                  put("t1", id(b_t1).state);
                  put("t2", id(b_t2).state);
                  put("t_mos", id(b_tmos).state);
                  put("cell_min", id(b_cmin).state);
                  put("cell_max", id(b_cmax).state);
                  put("cell_delta", id(b_cd).state);
                  flag("chg", id(b_chg));
                  flag("dsg", id(b_dsg));
                  flag("bal", id(b_bal));
                  put("rssi", id(w_rssi).state);
                  put("uptime", id(up).state);
                  put("cell_avg", id(b_cavg).state);
                  put("bal_a", id(b_bal_a).state);
                  put("cell_min_i", id(b_cmin_i).state);
                  put("cell_max_i", id(b_cmax_i).state);
                  sensor::Sensor *const cv[] = {id(b_c1), id(b_c2), id(b_c3), id(b_c4), id(b_c5), id(b_c6), id(b_c7), id(b_c8), id(b_c9), id(b_c10), id(b_c11), id(b_c12), id(b_c13), id(b_c14), id(b_c15), id(b_c16)};
                  sensor::Sensor *const cr[] = {id(b_r1), id(b_r2), id(b_r3), id(b_r4), id(b_r5), id(b_r6), id(b_r7), id(b_r8), id(b_r9), id(b_r10), id(b_r11), id(b_r12), id(b_r13), id(b_r14), id(b_r15), id(b_r16)};
                  char k[5];
                  for (int i = 0; i < 16; i++) {
                    snprintf(k, sizeof k, "c%d", i + 1); put(k, cv[i]->state);
                    snprintf(k, sizeof k, "r%d", i + 1); put(k, cr[i]->state);
                  }
