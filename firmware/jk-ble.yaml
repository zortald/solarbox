# Отправка в Solarbox: по запросу на каждую заданную BMS (слот 1 — всегда,
# с данными о плате и найденных рядом BMS).
http_request:
  verify_ssl: false
  timeout: 3s

interval:
  # Перезагрузка только если заданная BMS 10 минут не присылает данных
  # (завис Bluetooth). Слот без MAC (или с неверным MAC) не проверяется.
  - interval: 30s
    then:
      - lambda: |-
          if (id(bms1_on) && millis() - id(bms1_seen) > 10 * 60 * 1000) {
            ESP_LOGW("watchdog", "слот 1: BMS молчит 10 мин — перезагрузка");
            App.safe_reboot();
          }
          if (id(bms2_on) && millis() - id(bms2_seen) > 10 * 60 * 1000) {
            ESP_LOGW("watchdog", "слот 2: BMS молчит 10 мин — перезагрузка");
            App.safe_reboot();
          }
  - interval: 5s
    then:
      - script.execute: ingest_url
      - if:
          condition:
            lambda: return wifi::global_wifi_component->is_connected() && (true);
          then:
            - http_request.post:
                url: !lambda return id(sb_target);
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["device"] = id(dev1_name).state.empty() ? "bms" : id(dev1_name).state;
                  JsonObject b = root["board"].to<JsonObject>();
                  b["type"] = "jk-ble";
                  b["fw"] = "${fw_version}";
                  b["chip"] = "ESP32-C3";
                  b["mac"] = get_mac_address_pretty();
                  b["slot"] = 1;
                  b["slots"] = 2;
                  b["bms_mac"] = id(bms1_mac).state;
                  b["proto"] = id(bms1_proto).current_option();
                  b["connected"] = id(bms1_client)->connected();
                  {
                    esp_netif_ip_info_t ii;
                    esp_netif_get_ip_info(esp_netif_get_handle_from_ifkey("WIFI_STA_DEF"), &ii);
                    char ipb[16];
                    esp_ip4addr_ntoa(&ii.ip, ipb, sizeof ipb);
                    b["ip"] = ipb;
                  }
                  {
                    JsonArray f = b["found"].to<JsonArray>();
                    for (auto &kv : id(found)) {
                      JsonObject o = f.add<JsonObject>();
                      o["mac"] = kv.first;
                      auto q = kv.second.rfind('|');
                      o["name"] = kv.second.substr(0, q);
                      o["rssi"] = atoi(kv.second.c_str() + q + 1);
                    }
                  }
                  JsonObject m = root["metrics"].to<JsonObject>();
                  auto put = [&](const char *k, float v) { if (!std::isnan(v)) m[k] = v; };
                  auto flag = [&](const char *k, binary_sensor::BinarySensor *s) { if (s->has_state()) m[k] = s->state ? 1 : 0; };
                  if (!id(bms1_client)->connected()) return;
                  put("soc", id(b1_soc).state);
                  put("bms_v", id(b1_v).state);
                  put("bms_a", id(b1_a).state);
                  put("bms_w", id(b1_w).state);
                  put("cap_ah", id(b1_cap).state);
                  put("fcc_ah", id(b1_fcc).state);
                  put("cycles", id(b1_cycles).state);
                  put("t1", id(b1_t1).state);
                  put("t2", id(b1_t2).state);
                  put("t_mos", id(b1_tmos).state);
                  put("cell_min", id(b1_cmin).state);
                  put("cell_max", id(b1_cmax).state);
                  put("cell_delta", id(b1_cd).state);
                  flag("chg", id(b1_chg));
                  flag("dsg", id(b1_dsg));
                  flag("bal", id(b1_bal));
                  put("rssi", id(w_rssi).state);
                  put("uptime", id(up).state);
                  put("cell_avg", id(b1_cavg).state);
                  put("bal_a", id(b1_bal_a).state);
                  put("cell_min_i", id(b1_cmin_i).state);
                  put("cell_max_i", id(b1_cmax_i).state);
