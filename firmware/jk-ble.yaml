# GENERATED by gen-jk-ble.py (2 slots, c3) — edit the generator, not this file.
#
# Solarbox · плата JK BMS по Bluetooth (ESP32-C3), до 2 BMS на одной плате.
# Универсальная прошивка: ничего про объект внутри. Wi-Fi задаётся после прошивки
# (web.esphome.io → Improv, или точка доступа платы), адрес Solarbox, MAC и
# протокол каждой BMS — в мастере Solarbox или на веб-странице платы. Всё хранится
# во флеше и переживает обновления по воздуху.
#
# Пустой «Solarbox URL» = http://<шлюз сети>:8080 — Solarbox на роутере.
# Слот без MAC ничего не делает и ничего не шлёт.

substitutions:
  fw_version: "1.2.0"

esphome:
  name: solarbox-bms
  friendly_name: Solarbox BMS
  name_add_mac_suffix: true
  project:
    name: solarbox.jk-ble
    version: ${fw_version}
  on_boot:
    - priority: -100
      then:
        - script.execute: apply_bms1
        - script.execute: apply_bms2

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
  - platform: web_server

# Сетей нет в прошивке — поэтому сохранённый Wi-Fi не теряется при обновлениях.
wifi:
  ap:
    ssid: "Solarbox-BMS"
    password: "solarbox"
  power_save_mode: none

captive_portal:
improv_serial:

web_server:
  port: 80

external_components:
  - source: github://syssi/esphome-jk-bms@main
    components: [jk_bms_ble]
    refresh: 1d

# Поиск BMS рядом: имена JK-* попадают в список, Solarbox показывает его в мастере.
globals:
  - id: found
    type: std::map<std::string, std::string>
  - id: sb_target
    type: std::string
  - id: bms1_seen
    type: uint32_t
    initial_value: "0"
  - id: bms1_on
    type: bool
    initial_value: "false"
  - id: bms2_seen
    type: uint32_t
    initial_value: "0"
  - id: bms2_on
    type: bool
    initial_value: "false"

esp32_ble:
  max_connections: 3

esp32_ble_tracker:
  scan_parameters:
    active: true
  on_ble_advertise:
    - then:
        - lambda: |-
            const std::string &n = x.get_name();
            if (n.rfind("JK", 0) == 0 || n.rfind("jk", 0) == 0) {
              if (id(found).size() < 12 || id(found).count(x.address_str()))
                id(found)[x.address_str()] = n + "|" + std::to_string(x.get_rssi());
            }

ble_client:
  - mac_address: "00:00:00:00:00:01"
    id: bms1_client
    auto_connect: false
  - mac_address: "00:00:00:00:00:02"
    id: bms2_client
    auto_connect: false

jk_bms_ble:
  - ble_client_id: bms1_client
    id: bms1
    protocol_version: JK02_32S
    throttle: 2s
  - ble_client_id: bms2_client
    id: bms2
    protocol_version: JK02_32S
    throttle: 2s

script:
  - id: ingest_url
    then:
      - lambda: |-
          std::string u = id(sb_url).state;
          if (u.empty()) {
            esp_netif_ip_info_t ip;
            esp_netif_get_ip_info(esp_netif_get_handle_from_ifkey("WIFI_STA_DEF"), &ip);
            char gw[16];
            esp_ip4addr_ntoa(&ip.gw, gw, sizeof gw);
            u = std::string("http://") + gw + ":8080";
          }
          while (!u.empty() && u.back() == '/') u.pop_back();
          id(sb_target) = u + "/api/ingest";
  - id: apply_bms1
    then:
      - lambda: |-
          auto *cl = id(bms1_client);
          std::string pr = id(bms1_proto).current_option();
          id(bms1).set_protocol_version(pr == "JK04" ? jk_bms_ble::PROTOCOL_VERSION_JK04
              : pr == "JK02_24S" ? jk_bms_ble::PROTOCOL_VERSION_JK02_24S : jk_bms_ble::PROTOCOL_VERSION_JK02_32S);
          uint64_t a = 0; int n = 0;
          for (char c : id(bms1_mac).state) {
            int v = (c >= '0' && c <= '9') ? c - '0' : (c >= 'a' && c <= 'f') ? c - 'a' + 10 : (c >= 'A' && c <= 'F') ? c - 'A' + 10 : -1;
            if (v < 0) continue;
            a = (a << 4) | v; n++;
          }
          cl->disconnect();
          id(bms1_seen) = millis();
          id(bms1_on) = n == 12;
          if (n != 12) { cl->set_auto_connect(false); ESP_LOGI("solarbox", "слот 1: BMS не задана"); return; }
          cl->set_address(a);
          cl->set_auto_connect(true);
          ESP_LOGI("solarbox", "слот 1: BMS %s, %s", id(bms1_mac).state.c_str(), pr.c_str());
  - id: apply_bms2
    then:
      - lambda: |-
          auto *cl = id(bms2_client);
          std::string pr = id(bms2_proto).current_option();
          id(bms2).set_protocol_version(pr == "JK04" ? jk_bms_ble::PROTOCOL_VERSION_JK04
              : pr == "JK02_24S" ? jk_bms_ble::PROTOCOL_VERSION_JK02_24S : jk_bms_ble::PROTOCOL_VERSION_JK02_32S);
          uint64_t a = 0; int n = 0;
          for (char c : id(bms2_mac).state) {
            int v = (c >= '0' && c <= '9') ? c - '0' : (c >= 'a' && c <= 'f') ? c - 'a' + 10 : (c >= 'A' && c <= 'F') ? c - 'A' + 10 : -1;
            if (v < 0) continue;
            a = (a << 4) | v; n++;
          }
          cl->disconnect();
          id(bms2_seen) = millis();
          id(bms2_on) = n == 12;
          if (n != 12) { cl->set_auto_connect(false); ESP_LOGI("solarbox", "слот 2: BMS не задана"); return; }
          cl->set_address(a);
          cl->set_auto_connect(true);
          ESP_LOGI("solarbox", "слот 2: BMS %s, %s", id(bms2_mac).state.c_str(), pr.c_str());

text:
  - platform: template
    id: sb_url
    name: "Solarbox URL"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 96
    initial_value: ""
  - platform: template
    id: bms1_mac
    name: "BMS MAC"
    mode: text
    optimistic: true
