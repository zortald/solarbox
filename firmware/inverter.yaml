    name: "${name} hist batt"
  - platform: template
    id: hist_grid
    name: "${name} hist grid"
  - platform: template
    id: wifi_scan_result
    name: "${name} wifi scan"
    icon: mdi:wifi-marker

  - platform: pipsolar
    pipsolar_id: inverter0
    device_mode:
      id: s_mode
      name: "${name} device_mode"
    # сырые ответы инвертора: текущие настройки, флаги, модель, предупреждения
    last_qpiri:
      name: "${name} raw qpiri"
    last_qflag:
      name: "${name} raw qflag"
    last_qmn:
      name: "${name} raw qmn"
    last_qpiws:
