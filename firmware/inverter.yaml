# ESP8266-логгер для инвертора PI30 (2400 бод).
# Wi-Fi: известные сети вшиты, точка "inverter" поднимается только как запасная.
# Пока точка поднята, ESPHome сам перебирает известные сети раз в ~30 с — перезагружать не нужно.
# Статистика и отключения считаются на плате и без Wi-Fi; Wi-Fi нужен только чтобы смотреть.
#
#   esphome run inverter.yaml --device <ip платы>

substitutions:
  name: inverter
  site_ssid: !secret site_wifi_ssid
  site_psk: !secret site_wifi_password

esphome:
  name: ${name}
  on_boot:
    # Если сохранена сеть платы батареи (или пустая) — забыть её и вернуться
    # в основную сеть, чтобы плата не застряла в изолированной сети "battery".
    - priority: 200
      then:
        - lambda: |-
            std::string saved = wifi::global_wifi_component->get_sta().get_ssid();
            if (saved.empty() || saved == "battery") {
              ESP_LOGW("wifi_guard", "Сохранена сеть '%s' — возвращаюсь в ${site_ssid}", saved.c_str());
              wifi::global_wifi_component->save_wifi_sta("${site_ssid}", "${site_psk}");
            }
    - priority: -100
      then:
        - delay: 60s
        - script.execute: wifi_scan

esp8266:
  board: d1_mini
  # по умолчанию restore_value на ESP8266 живёт в RTC-памяти и теряется при пропадании питания
  restore_from_flash: true

logger:
  baud_rate: 0
  # pipsolar на DEBUG пишет 4–5 строк/с — на слабом Wi-Fi это лишний трафик
  level: WARN

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
  - platform: web_server

wifi:
  networks:
    - ssid: ${site_ssid}
      password: ${site_psk}
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  output_power: 20dB
  power_save_mode: none
  ap:
    ssid: "inverter"
    password: "88888888"
    ap_timeout: 3min

captive_portal:


# причина последней перезагрузки и свободная память — для диагностики самопроизвольных перезагрузок
debug:
  update_interval: 30s

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Kyiv

# счётчики пишутся во flash раз в час (и при плановой перезагрузке), чтобы не изнашивать память
preferences:
  flash_write_interval: 1h

# Статистика: [солнце, нагрузка, заряд АКБ, разряд АКБ, сеть≈] в Вт·ч
globals:
  - id: e_today
    type: std::array<float, 5>
    restore_value: yes
  - id: e_yday
    type: std::array<float, 5>
    restore_value: yes
  - id: e_month
    type: std::array<float, 5>
    restore_value: yes
  - id: e_day
    type: int
    restore_value: yes
    initial_value: '0'
  - id: e_mon
    type: int
    restore_value: yes
    initial_value: '0'
  # Отключения сети: начало текущего (0 — сеть есть), журнал [начало, длительность] на 20 событий,
  # счётчики [раз, секунд] за сегодня / вчера / месяц
  - id: out_start
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: out_log
    type: std::array<uint32_t, 40>
    restore_value: yes
  - id: out_n
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: out_cnt
    type: std::array<uint32_t, 6>
    restore_value: yes
  - id: wifi_pending
    type: std::string
  # сутки по 10 минут: [солнце, нагрузка, батарея(+заряд/−разряд), сеть≈] в Вт, только в памяти
  - id: hist
    type: std::array<int16_t, 576>
  - id: hist_n
    type: int
    initial_value: '0'

web_server:
  port: 80
  # своя панель вместо стандартной: inverter-panel.js зашит в прошивку, интернет не нужен
  js_url: ""
  js_include: "inverter-panel.js"
  log: false

text:
  # Подключение к другой сети: значение "ИМЯ<TAB>ПАРОЛЬ". Состояние не публикуется — пароль не виден на странице.
  # wifi.configure пробует новую сеть 30 с и при неудаче сам возвращается к прежней.
  - platform: template
    name: "${name} wifi connect"
    mode: password
    max_length: 100
    set_action:
      - lambda: |-
          auto tab = x.find('\t');
          if (tab == std::string::npos || tab == 0 || tab > 32) { id(wifi_status).publish_state("неверный ввод"); return; }
          id(wifi_status).publish_state("подключаюсь к " + x.substr(0, tab) + "…");
          id(wifi_pending) = x.substr(0, tab);
          id(wifi_switch).execute(x.substr(0, tab), x.substr(tab + 1));

  # Команда настройки инвертора (PI30). Панель собирает строку; здесь пропускаются только разрешённые
  # команды — без PF (заводской сброс), RTEY/RTDL (стирание данных), DAT, V<nnn>, POPM, ATE.
  - platform: template
    name: "${name} command"
    id: inverter_command
    mode: text
    max_length: 16
    optimistic: true
    set_action:
      - lambda: |-
          static const char *const allowed[] = {"POP", "PCP", "PGR", "PBT", "PBCV", "PBDV", "PSDV", "PCVV", "PBFT",
                                                "MUCHGC", "MNCHGC", "MCHGC", "PE", "PD", "F50", "F60"};
          std::string cmd = x;
          for (auto &c : cmd) c = toupper(c);
          bool ok = !cmd.empty() && cmd.size() <= 12;
          for (auto c : cmd) if (!isalnum(c) && c != '.') ok = false;
          bool known = false;
          for (auto *a : allowed) if (cmd.rfind(a, 0) == 0) known = true;
          if (!ok || !known) { ESP_LOGW("command", "Отклонено: %s", cmd.c_str()); return; }
          ESP_LOGW("command", "В инвертор: %s", cmd.c_str());
          id(inverter0)->queue_command(cmd);

button:
  - platform: restart
    name: "${name} restart"
  - platform: template
    name: "${name} wifi scan start"
    icon: mdi:wifi-refresh
    on_press:
      - script.execute: wifi_scan

script:
  - id: wifi_switch
    parameters:
      ssid: string
      password: string
    then:
      - wifi.configure:
          ssid: !lambda return ssid;
          password: !lambda return password;
          save: true
          timeout: 30s
          on_connect:
            - lambda: id(wifi_status).publish_state("подключено к " + id(wifi_pending));
          on_error:
            - lambda: id(wifi_status).publish_state("не удалось подключиться к " + id(wifi_pending) + ", вернулась к прежней сети");

  # публикует суточную историю: по ряду на серию, значения через запятую, от старых к новым
  - id: publish_history
    then:
      - lambda: |-
          int n = std::min(id(hist_n), 144), start = id(hist_n) - n;
          text_sensor::TextSensor *out[4] = {id(hist_pv), id(hist_load), id(hist_batt), id(hist_grid)};
          for (int k = 0; k < 4; k++) {
            std::string s;
            s.reserve(n * 5);
            for (int j = 0; j < n; j++) {
              if (j) s += ',';
              s += to_string(id(hist)[((start + j) % 144) * 4 + k]);
            }
            out[k]->publish_state(s);
          }
  # Фоновый скан эфира с места установки: какие сети видно и с каким сигналом.
  - id: wifi_scan
    then:
      - lambda: |-
          wifi_station_scan(nullptr, [](void *arg, STATUS status) {
            if (status != OK) { id(wifi_scan_result).publish_state("scan failed"); return; }
            std::vector<std::pair<int, std::string>> found;
            for (auto *it = (bss_info *) arg; it != nullptr; it = STAILQ_NEXT(it, next)) {
              char line[64];
              snprintf(line, sizeof(line), "%.*s %02X:%02X:%02X:%02X:%02X:%02X ch%d %ddBm",
                       it->ssid_len, (const char *) it->ssid, it->bssid[0], it->bssid[1], it->bssid[2],
                       it->bssid[3], it->bssid[4], it->bssid[5], it->channel, it->rssi);
              found.emplace_back(it->rssi, line);
            }
            std::sort(found.begin(), found.end(), [](auto &a, auto &b) { return a.first > b.first; });
            std::string out;
            for (auto &f : found) { if (out.size() + f.second.size() > 240) break; out += f.second + "; "; }
            id(wifi_scan_result).publish_state(out.empty() ? "nothing found" : out);
          });

interval:
  - interval: 10s
    then:
      - lambda: |-
          auto v = [](sensor::Sensor *x) { return std::isnan(x->state) ? 0.0f : x->state; };
          float pv = v(id(s_pv)), load = v(id(s_load));
          float batt = v(id(s_bv)) * (v(id(s_bc)) - v(id(s_bd)));
          float grid = id(s_mode)->state == "L" ? std::max(0.0f, load + std::max(batt, 0.0f) - pv) : 0.0f;
          float p[5] = {pv, load, std::max(batt, 0.0f), std::max(-batt, 0.0f), grid};

          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            if (id(e_day) != 0 && id(e_day) != t.day_of_month) {
              id(e_yday) = id(e_today);
              id(e_today).fill(0);
              id(out_cnt)[2] = id(out_cnt)[0]; id(out_cnt)[3] = id(out_cnt)[1];
              id(out_cnt)[0] = 0; id(out_cnt)[1] = 0;
            }
            if (id(e_mon) != 0 && id(e_mon) != t.month) { id(e_month).fill(0); id(out_cnt)[4] = 0; id(out_cnt)[5] = 0; }
            id(e_day) = t.day_of_month;
            id(e_mon) = t.month;
          }
          for (int i = 0; i < 5; i++) {
            id(e_today)[i] += p[i] * 10 / 3600.0f;
            id(e_month)[i] += p[i] * 10 / 3600.0f;
          }

          // Отключения: сеть < 150 В два замера подряд — начало; ≥ 150 В два замера подряд — конец
          if (t.is_valid() && !std::isnan(id(s_gv)->state)) {
            static int down = 0, up = 0;
            bool grid_ok = id(s_gv)->state >= 150;
            down = grid_ok ? 0 : down + 1;
            up = grid_ok ? up + 1 : 0;
            uint32_t now = t.timestamp;
            if (id(out_start) == 0 && down == 2) {
              id(out_start) = now - 10;
              id(out_cnt)[0]++; id(out_cnt)[4]++;
              ESP_LOGW("outage", "Пропала сеть");
              global_preferences->sync();
            } else if (id(out_start) != 0 && up == 2) {
              int slot = id(out_n) % 20;
              id(out_log)[slot * 2] = id(out_start);
              id(out_log)[slot * 2 + 1] = now - 10 - id(out_start);
              id(out_n)++;
              id(out_start) = 0;
              ESP_LOGW("outage", "Сеть вернулась");
              global_preferences->sync();
            }
            if (id(out_start) != 0) { id(out_cnt)[1] += 10; id(out_cnt)[5] += 10; }
          }

          // средние за 10 минут в кольцевой буфер на сутки
          static float acc[4] = {0, 0, 0, 0};
          static int ticks = 0;
          acc[0] += pv; acc[1] += load; acc[2] += batt; acc[3] += grid;
          if (++ticks >= 60) {
            int slot = id(hist_n) % 144;
            for (int i = 0; i < 4; i++) { id(hist)[slot * 4 + i] = (int16_t) lroundf(acc[i] / ticks); acc[i] = 0; }
            ticks = 0;
            id(hist_n)++;
            id(publish_history).execute();
          }

  - interval: 60s
    then:
      - lambda: |-
          char buf[200];
          auto &a = id(e_today), &b = id(e_yday), &c = id(e_month);
          snprintf(buf, sizeof(buf), "{\"t\":[%.0f,%.0f,%.0f,%.0f,%.0f],\"y\":[%.0f,%.0f,%.0f,%.0f,%.0f],\"m\":[%.0f,%.0f,%.0f,%.0f,%.0f]}",
                   a[0], a[1], a[2], a[3], a[4], b[0], b[1], b[2], b[3], b[4], c[0], c[1], c[2], c[3], c[4]);
          id(stats_txt).publish_state(buf);

          // отключения: {"cur":начало|0,"now":сейчас,"c":[раз,сек сегодня, вчера, месяц],"log":[начало,длит,...] новые первыми}
          auto t = id(sntp_time).now();
          std::string o = "{\"cur\":" + to_string(id(out_start)) + ",\"now\":" + to_string(t.is_valid() ? t.timestamp : 0) + ",\"c\":[";
          for (int i = 0; i < 6; i++) { if (i) o += ','; o += to_string(id(out_cnt)[i]); }
          o += "],\"log\":[";
          int n = std::min<uint32_t>(id(out_n), 20);
          for (int j = 0; j < n; j++) {
            int slot = (id(out_n) - 1 - j) % 20;
            if (j) o += ',';
            o += to_string(id(out_log)[slot * 2]) + "," + to_string(id(out_log)[slot * 2 + 1]);
          }
          o += "]}";
          id(outages_txt).publish_state(o);


  # Push to solarbox (standalone dashboard on the main router container).
  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.post:
                # Solarbox runs on the Wi-Fi gateway (the site router).
                url: !lambda 'return std::string("http://") + WiFi.gatewayIP().toString().c_str() + ":8080/api/ingest";'
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["device"] = "inverter";
                  JsonObject m = root["metrics"].to<JsonObject>();
                  auto put = [&](const char *k, float v) { if (!std::isnan(v)) m[k] = v; };
                  put("ac_out_w", id(s_load).state);
                  put("pv_w", id(s_pv).state);
                  put("pv_v", id(s_pvv).state);
                  put("grid_v", id(s_gv).state);
                  put("grid_hz", id(s_gf).state);
                  put("out_v", id(s_ov).state);
                  put("load_pct", id(s_lp).state);
                  put("batt_v", id(s_bv).state);
                  put("batt_chg_a", id(s_bc).state);
                  put("batt_dis_a", id(s_bd).state);
                  put("temp", id(s_temp).state);
                  put("rssi", id(w_rssi).state);
                  put("uptime", id(up).state);

http_request:
  verify_ssl: false
  esp8266_disable_ssl_support: true
  timeout: 3s

uart:
  id: uart_0
  baud_rate: 2400
  tx_pin: GPIO1
  rx_pin: GPIO3

pipsolar:
  uart_id: uart_0
  id: inverter0

sensor:
  - platform: debug
    free:
      name: "${name} heap free"
    block:
      name: "${name} heap max block"
    fragmentation:
      name: "${name} heap fragmentation"
  - platform: wifi_signal
    id: w_rssi
    name: "${name} wifi_signal"
  - platform: uptime
    id: up
    internal: true
    update_interval: 60s

  - platform: pipsolar
    pipsolar_id: inverter0
    grid_voltage:
      id: s_gv
      name: "${name} grid_voltage"
    grid_frequency:
      id: s_gf
      name: "${name} grid_frequency"
    ac_output_voltage:
      id: s_ov
      name: "${name} ac_output_voltage"
    ac_output_frequency:
      name: "${name} ac_output_frequency"
    ac_output_apparent_power:
      name: "${name} ac_output_apparent_power"
    ac_output_active_power:
      id: s_load
      name: "${name} ac_output_active_power"
    output_load_percent:
      id: s_lp
      name: "${name} output_load_percent"
    bus_voltage:
      name: "${name} bus_voltage"
    battery_voltage:
      id: s_bv
      name: "${name} battery_voltage"
    battery_charging_current:
      id: s_bc
      name: "${name} battery_charging_current"
    battery_capacity_percent:
      name: "${name} battery_capacity_percent"
    inverter_heat_sink_temperature:
      id: s_temp
      name: "${name} inverter_heat_sink_temperature"
    pv_input_current_for_battery:
      name: "${name} pv_input_current_for_battery"
    pv_input_voltage:
      id: s_pvv
      name: "${name} pv_input_voltage"
    battery_voltage_scc:
      name: "${name} battery_voltage_scc"
    battery_discharge_current:
      id: s_bd
      name: "${name} battery_discharge_current"
    battery_voltage_offset_for_fans_on:
      name: "${name} battery_voltage_offset_for_fans_on"
    pv_charging_power:
      id: s_pv
      name: "${name} pv_charging_power"

text_sensor:
  - platform: version
    name: "${name} version"
  - platform: debug
    reset_reason:
      name: "${name} reset reason"
  - platform: wifi_info
    ssid:
      name: "${name} wifi ssid"
    ip_address:
      name: "${name} wifi ip"
  - platform: template
    id: wifi_status
    name: "${name} wifi status"
  - platform: template
    id: stats_txt
    name: "${name} stats"
  - platform: template
    id: outages_txt
    name: "${name} outages"
  - platform: template
    id: hist_pv
    name: "${name} hist pv"
  - platform: template
    id: hist_load
    name: "${name} hist load"
  - platform: template
