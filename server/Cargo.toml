[package]
name = "solarbox"
version = "0.1.0"
edition = "2021"
description = "Push-based telemetry collector + dashboard for off-grid inverter/BMS sites"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "time", "io-util", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rust-embed = "8"
mime_guess = "2"
md-5 = "0.10"
libc = "0.2"
ring = "0.17"
base64 = "0.22"
# HTTPS server side: ring only (aws-lc-rs does not build for armv5).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Small, static, long-lived service: optimise for size, abort on panic
# (the container restarts it), one codegen unit + LTO for a lean binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
