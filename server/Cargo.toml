[package]
name = "solarbox"
version = "0.1.0"
edition = "2021"
description = "Push-based telemetry collector + dashboard for off-grid inverter/BMS sites"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rust-embed = "8"
mime_guess = "2"
md-5 = "0.10"

# Small, static, long-lived service: optimise for size, abort on panic
# (the container restarts it), one codegen unit + LTO for a lean binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
