# Checks on every push: server tests, the server built for every router/box
# architecture, one board image via esphome/build-action, JS syntax, generated
# firmware up to date.
name: ci
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo test --release
        working-directory: server

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: installer }
      - run: cargo test --release
        working-directory: installer

  # Static musl server binary for every router/box architecture, the same
  # script on-demand builds use. armv5 = EN7562CT routers (catches crypto
  # backends that don't build there); mips is an experiment (see the script).
  cross:
    runs-on: ubuntu-latest
    continue-on-error: ${{ startsWith(matrix.arch, 'mips') }}
    strategy:
      fail-fast: false
      matrix:
        arch: [armv5, armv7, arm64, x86_64, mips, mipsel]
    name: cross (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        if: ${{ startsWith(matrix.arch, 'mips') }}
        with: { components: rust-src }
      - name: zig for mips
        if: ${{ startsWith(matrix.arch, 'mips') }}
        run: pip install -q ziglang cargo-zigbuild
      - run: ./deploy/ci-build-server.sh ${{ matrix.arch }} dist

  # One board image through the official ESPHome build action (the path
  # on-demand builds will take).
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esphome/build-action@v7
        with:
          yaml-file: firmware/jk-ble.yaml
          version: 2026.10.2

  ui-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: JS syntax
        run: for f in server/static/*.js firmware/*.js relay/src/*.js; do node --check "$f" || exit 1; done
      - name: build relay
        run: node --test relay/test.mjs
      - name: jk-ble.yaml matches its generator
        run: python3 firmware/gen-jk-ble.py && git diff --exit-code firmware/jk-ble.yaml
