# Checks on every push: server tests, the server built for every router/box
# architecture, one board image via esphome/build-action, JS syntax, generated
# firmware up to date.
name: ci
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo test --release
        working-directory: server

  # Static musl server binary for every router/box architecture. armv5 =
  # EN7562CT routers (catches crypto backends that don't build there). mips is
  # tier 3 in Rust (no prebuilt std): nightly + build-std + zig, an experiment.
  cross:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tool: armv5te-musleabi, target: armv5te-unknown-linux-musleabi, experimental: false }
          - { tool: armv7-musleabihf, target: armv7-unknown-linux-musleabihf, experimental: false }
          - { tool: aarch64-musl, target: aarch64-unknown-linux-musl, experimental: false }
          - { tool: x86_64-musl, target: x86_64-unknown-linux-musl, experimental: false }
          - { tool: mips-musl, target: mips-unknown-linux-musl, experimental: true }
          - { tool: mipsel-musl, target: mipsel-unknown-linux-musl, experimental: true }
    name: cross (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4
      - name: build
        if: ${{ !matrix.experimental }}
        run: docker run --rm -v "$PWD/server":/src -w /src messense/rust-musl-cross:${{ matrix.tool }} cargo build --release
      # mips: nightly on the runner, zig as the cross C compiler and linker.
      - uses: dtolnay/rust-toolchain@nightly
        if: ${{ matrix.experimental }}
        with: { components: rust-src }
      - name: build (nightly + build-std)
        if: ${{ matrix.experimental }}
        working-directory: server
        run: |
          pip install -q ziglang cargo-zigbuild
          cargo zigbuild --release -Zbuild-std=std,panic_abort --target ${{ matrix.target }}
      - name: size
        run: ls -l server/target/${{ matrix.target }}/release/solarbox && file server/target/${{ matrix.target }}/release/solarbox

  # One board image through the official ESPHome build action (the path
  # on-demand builds will take).
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esphome/build-action@v7
        with:
          yaml-file: firmware/jk-ble.yaml
          version: 2026.10.2

  ui-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: JS syntax
        run: for f in server/static/*.js firmware/*.js; do node --check "$f" || exit 1; done
      - name: jk-ble.yaml matches its generator
        run: python3 firmware/gen-jk-ble.py && git diff --exit-code firmware/jk-ble.yaml
