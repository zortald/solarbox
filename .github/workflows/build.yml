# On-demand build: one artifact for one release, started by the build relay
# (or by hand). Already in the release → nothing to do. Otherwise build on a
# runner of the right OS, then sign (ed25519, SB_SIGNING_KEY; public key in
# server/signing-key.pub) and upload on Linux, creating the release from the
# tag if needed. The run name is what the relay matches to see a build
# already running.
name: build
run-name: build ${{ inputs.kind }} ${{ inputs.arch }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [server, installer, firmware]
      arch:
        description: "server: armv5 armv7 arm64 x86_64 mips mipsel · installer: linux-x86_64 linux-arm64 macos-arm64 macos-x86_64 windows-x86_64 windows-arm64 android-arm64 · firmware: <chip>-jk<n> (c3-jk1 c3-jk2 s3-jk1..3 esp32-jk1..3)"
        required: true
      version:
        description: release tag, e.g. v0.1.0
        required: true

concurrency:
  group: build-${{ inputs.kind }}-${{ inputs.arch }}-${{ inputs.version }}

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ inputs.version }}
  ASSET: solarbox-${{ inputs.kind }}-${{ inputs.arch }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.have.outputs.done }}
    steps:
      - name: known combination?
        run: |
          case "${{ inputs.kind }} ${{ inputs.arch }}" in
            "server armv5"|"server armv7"|"server arm64"|"server x86_64"|"server mips"|"server mipsel") ;;
            "installer linux-x86_64"|"installer linux-arm64"|"installer macos-arm64"|"installer macos-x86_64") ;;
            "installer windows-x86_64"|"installer windows-arm64"|"installer android-arm64") ;;
            "firmware c3-jk1"|"firmware c3-jk2"|"firmware s3-jk1"|"firmware s3-jk2"|"firmware s3-jk3"|"firmware esp32-jk1"|"firmware esp32-jk2"|"firmware esp32-jk3") ;;
            *) echo "unknown: ${{ inputs.kind }} ${{ inputs.arch }}"; exit 1 ;;
          esac
      - name: already built?
        id: have
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Eq "^$ASSET(\.exe|\.bin)?\.sig$"; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "$ASSET is in $TAG already"
          fi

  build:
    needs: check
    if: ${{ !needs.check.outputs.done }}
    runs-on: ${{ startsWith(inputs.arch, 'macos') && 'macos-latest' || startsWith(inputs.arch, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.version }}" }
      - uses: dtolnay/rust-toolchain@nightly
        if: ${{ inputs.kind == 'server' && startsWith(inputs.arch, 'mips') }}
        with: { components: rust-src }
      - name: zig for mips
        if: ${{ inputs.kind == 'server' && startsWith(inputs.arch, 'mips') }}
        run: pip install -q ziglang cargo-zigbuild
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.kind == 'installer' && !startsWith(inputs.arch, 'linux') }}
      - name: build
        if: ${{ inputs.kind != 'firmware' }}
        run: ./deploy/ci-build-${{ inputs.kind }}.sh "${{ inputs.arch }}" dist
      # Board firmware: the generator states what is flashed and for what,
      # the official ESPHome action builds it (version pinned).
      - name: generate firmware
        if: ${{ inputs.kind == 'firmware' }}
        run: |
          chip=${ARCH%-jk*}; n=${ARCH##*-jk}
          mkdir -p fw && python3 firmware/gen-jk-ble.py "$n" "$chip" "fw/$ASSET.yaml"
        env: { ARCH: "${{ inputs.arch }}" }
      - uses: esphome/build-action@v7
        if: ${{ inputs.kind == 'firmware' }}
        id: esphome
        with:
          yaml-file: fw/${{ env.ASSET }}.yaml
          version: 2026.10.2
      - name: collect firmware
        if: ${{ inputs.kind == 'firmware' }}
        run: |
          mkdir -p dist; ls -lR "${{ steps.esphome.outputs.name }}"
          cp "$(find "${{ steps.esphome.outputs.name }}" -name '*factory*.bin' | head -1)" "dist/$ASSET.bin"
          cp "$(find "${{ steps.esphome.outputs.name }}" -name '*ota*.bin' | head -1)" "dist/$ASSET.ota.bin"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: sign
        env:
          KEY: ${{ secrets.SB_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "SB_SIGNING_KEY is not set"; exit 1; }
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          for f in dist/*; do
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in "$f" -out "$f.sig"
          done
          rm "$RUNNER_TEMP/key.pem"
          ls -l dist
      - name: upload
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "" || gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null
          # The signature last: its presence means the artifact is complete.
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" $(ls dist/* | grep -v '\.sig$') --clobber
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/*.sig --clobber
