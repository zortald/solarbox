[package]
name = "solarbox-install"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Installs Solarbox into a container on the site's MikroTik router"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util"] }
# SSH for the two steps REST cannot do: holding the device-mode session open
# and uploading the image (SFTP). ring as the crypto backend: no C toolchain
# quirks on Windows/Android/armv5. rsa: many routers' host key is RSA.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde_json = "1"
ring = "0.17"
base64 = "0.22"
rpassword = "7"
netdev = "0.47"
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
